<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projek Taugey Pintar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tema-permainan tema-makmal">

    <div class="container">
        
        <div class="panel-kiri">
            <h2>Terminal Saintis</h2>
            <p>Sediakan bekas semaian. Taip arahan mengikut turutan:<br><br>
               1. <code>sedia.kapas()</code><br>
               2. <code>letak.benih(5)</code><br>
               3. <code>siram.air()</code>
            </p>

            <input type="text" id="arahanInput" placeholder="Taip kod di sini..." onkeydown="if(event.key === 'Enter') laksanaArahanTaugey()">
            <button onclick="laksanaArahanTaugey()">JALANKAN KOD</button>
            <button onclick="lajukanMasa()" style="background-color: #f39c12; margin-top: 10px;">⏳ MESIN MASA (+1 Hari)</button>
            <button onclick="resetTaugey()" style="background-color: #e74c3c; margin-top: 10px;">RESET PROJEK (Ujian)</button>

            <div class="kotak-maklum-balas" id="maklumBalas">
                Sistem pangkalan data disambung...
            </div>
        </div>

        <div class="panel-kanan">
            <h2 style="color: #2c3e50; text-align: center;">Kanvas Meja Makmal</h2>
            
            <div id="ruangAnimasi">
                <div class="teks-status" id="teksAnimasi">Status: Sila jalankan prosedur semaian.</div>
                
                <div style="position: absolute; bottom: 20px; left: 20px; font-family: monospace; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 5px;">
                    📅 Hari Ke: <span id="valHari">0</span><br>
                    ☁️ Kapas: <span id="valKapas">Belum</span><br>
                    🌱 Benih: <span id="valBenih">0</span> Biji<br>
                    💧 Air: <span id="valAir">Kering</span>
                </div>

                <div id="bekasTaugey" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 100px; transition: all 0.5s;">
                    🥣
                </div>
            </div>
        </div>

    </div>

    <audio id="bunyiBetul" src="assets/audio/betul.mp3"></audio>
    <audio id="bunyiSalah" src="assets/audio/salah.mp3"></audio>
    
    <script src="script-taugey.js"></script>
</body>
</html>
